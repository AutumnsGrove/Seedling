<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #333;
            max-width: 8.5in;
            margin: 0 auto;
            padding: 1in;
        }
        .date {
            text-align: right;
            color: #666;
            margin-bottom: 1em;
        }
        .greeting {
            margin-bottom: 1em;
        }
        .body {
            margin-bottom: 1em;
            text-align: justify;
        }
        .closing {
            margin-top: 2em;
            margin-bottom: 0.5em;
        }
        .signature {
            font-weight: 600;
        }
        .footer {
            margin-top: 3em;
            padding-top: 1em;
            border-top: 1px solid #ddd;
            font-size: 9pt;
            color: #888;
            text-align: center;
        }
        @media print {
            body {
                padding: 0.5in;
            }
        }
    </style>
</head>
<body>
    <div class="date">{{ date }}</div>

    <p class="greeting">{{ opening }}</p>

    <p class="body">{{ body }}</p>

    <p class="closing">{{ closing }}</p>

    <p class="signature">Autumn Brown</p>

    <div class="footer">
        <p>github.com/autumnsgrove • autumn@grove.place</p>
    </div>
</body>
</html>
